  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

056 206);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;\">⎘<\u002Fbutton>\n              <sc-if value=\"{{ sp.hasOccasion }}\">\n                <button onclick=\"{{ openDuplicateCampaign }}\" title=\"Duplicate the whole campaign for this occasion\" style=\"padding:6px 13px;border-radius:8px;border:1px solid oklch(1 0 0 / 0.12);background:oklch(0.24 0.044 206);color:oklch(0.85 0.056 206);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;\">🎯 Campaign<\u002Fbutton>\n              <\u002Fsc-if>\n              <button onclick=\"{{ editSelected }}\" style=\"padding:6px 13px;border-radius:8px;border:1px solid oklch(1 0 0 / 0.12);background:oklch(0.24 0.044 206);color:oklch(0.85 0.056 206);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;\">Edit<\u002Fbutton>\n            <\u002Fsc-if>\n            <button onclick=\"{{ closeDrawer }}\" style=\"width:30px;height:30px;flex:none;border-radius:8px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.24 0.044 206);color:oklch(0.8 0.075 206);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;\">×<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:16px 18px 4px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;\">\n          <sc-for list=\"{{ sp.platformList }}\" as=\"pf\" hint-placeholder-count=\"1\">\n            <span style=\"padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;{{ pf.badge }}\">{{ pf.label }}<\u002Fspan>\n          <\u002Fsc-for>\n          <span style=\"padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:600;background:oklch(0.26 0.046 206);color:oklch(0.8 0.075 206);\">{{ sp.typeLabel }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"padding:14px 18px 18px;display:flex;flex-direction:column;gap:9px;\">\n          <sc-if value=\"{{ sp.hasMedia }}\">\n            {{ sp.galleryEl }}\n            <sc-if value=\"{{ sp.hasMultiMedia }}\">\n              <div style=\"display:flex;align-items:center;justify-content:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(0.68 0.075 206);\">{{ sp.galleryPosLabel }} · use ← → keys or the arrows<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sp.hasVideoCaptions }}\">\n              <a href=\"{{ sp.videoCaptionUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:9px;background:oklch(0.78 0.15 155 / 0.1);border:1px solid oklch(0.78 0.15 155 / 0.28);color:oklch(0.78 0.15 155);font-size:12px;font-weight:600;text-decoration:none;\">💬 Captions file attached — open for editing<\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sp.needsVideoCaptions }}\">\n              <div style=\"display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:9px;background:oklch(0.32 0.051 206 / 0.5);border:1px solid oklch(1 0 0 / 0.09);color:oklch(0.68 0.075 206);font-size:12px;font-weight:600;\">No captions file attached for this video.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sp.noMedia }}\">\n            <div style=\"{{ sp.mediaStyle }}margin:0 auto;max-width:100%;border-radius:11px;overflow:hidden;background:repeating-linear-gradient(135deg,oklch(0.255 0.045 206) 0 12px,oklch(0.225 0.041 206) 12px 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px solid oklch(1 0 0 / 0.08);\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:oklch(0.68 0.075 206);letter-spacing:.02em;\">{{ sp.dims }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(0.58 0.092 206);\">{{ noMediaHint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"padding:2px 18px 28px;display:flex;flex-direction:column;gap:20px;\">\n\n          <div>\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:oklch(0.68 0.075 206);font-weight:600;\">Approval<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:9px;\">\n              <button onclick=\"{{ spApprove }}\" style=\"flex:1;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;{{ spApprStyle }}\">Approved<\u002Fbutton>\n              <button onclick=\"{{ spNeeds }}\" style=\"flex:1;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;{{ spNeedsStyle }}\">Needs work<\u002Fbutton>\n              <button onclick=\"{{ spPending }}\" style=\"flex:1;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;{{ spPendStyle }}\">Pending<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:oklch(0.68 0.075 206);font-weight:600;\">Compliance <span style=\"color:oklch(0.5 0.080 206);font-weight:500;text-transform:none;\">(separate from creative approval)<\u002Fspan><\u002Fdiv>\n            <button onclick=\"{{ spToggleCompliance }}\" style=\"display:flex;align-items:center;gap:8px;width:100%;margin-top:9px;padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;{{ spComplianceStyle }}\">\n              <span>{{ spComplianceMark }}<\u002Fspan> {{ spComplianceLabel }}\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"position:relative;\">\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:oklch(0.68 0.075 206);font-weight:600;\">Assigned to <span style=\"color:oklch(0.5 0.080 206);font-weight:500;text-transform:none;\">(pick as many as needed)<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ canEdit }}\">\n              <button onclick=\"{{ toggleAssignMenu }}\" style=\"display:flex;align-items:center;gap:9px;width:100%;margin-top:9px;padding:8px 11px;border-radius:9px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.16 0.033 206);cursor:pointer;font-family:inherit;text-align:left;\">\n                <sc-if value=\"{{ sp.hasAssignee }}\">\n                  <div style=\"display:flex;align-items:center;\">\n                    <sc-for list=\"{{ sp.cardAssigneesList }}\" as=\"a\" hint-placeholder-count=\"0\">\n                      <span style=\"{{ a.overlapStyle }}display:inline-flex;border-radius:50%;\">{{ a.avatarEl }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <span style=\"flex:1;font-size:13.5px;font-weight:600;color:oklch(0.88 0.045 206);\">{{ sp.assigneeLabel }}<\u002Fspan>\n                <span style=\"font-size:10px;color:oklch(0.66 0.078 206);\">▾<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ assignMenuOpen }}\">\n                <div style=\"position:absolute;top:64px;left:0;right:0;z-index:10;max-height:250px;overflow:auto;background:oklch(0.215 0.040 206 / 0.97);backdrop-filter:blur(10px);border:1px solid oklch(1 0 0 / 0.14);border-radius:11px;padding:5px;box-shadow:0 14px 34px oklch(0.06 0 0 / 0.5);display:flex;flex-direction:column;gap:2px;\">\n                  <sc-for list=\"{{ assignForList }}\" as=\"ao\" hint-placeholder-count=\"2\">\n                    <button onclick=\"{{ ao.pick }}\" style=\"display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;text-align:left;{{ ao.rowStyle }}\">\n                      <span style=\"width:16px;height:16px;flex:none;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;{{ ao.checkStyle }}\">{{ ao.checkMark }}<\u002Fspan>\n                      <sc-if value=\"{{ ao.avatarEl }}\">{{ ao.avatarEl }}<\u002Fsc-if>\n                      <span style=\"font-size:13px;font-weight:600;color:oklch(0.86 0.053 206);\">{{ ao.name }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ assignReadonly }}\">\n              <div style=\"display:flex;align-items:center;gap:9px;margin-top:9px;padding:8px 11px;border-radius:9px;border:1px solid oklch(1 0 0 / 0.08);background:oklch(0.2 0.038 206);\">\n                <sc-if value=\"{{ sp.hasAssignee }}\">\n                  <div style=\"display:flex;align-items:center;\">\n                    <sc-for list=\"{{ sp.cardAssigneesList }}\" as=\"a\" hint-placeholder-count=\"0\">\n                      <span style=\"{{ a.overlapStyle }}display:inline-flex;border-radius:50%;\">{{ a.avatarEl }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <span style=\"font-size:13.5px;font-weight:600;color:oklch(0.82 0.068 206);\">{{ sp.assigneeLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:oklch(0.68 0.075 206);font-weight:600;\">Caption<\u002Fdiv>\n            <p style=\"margin:9px 0 0;font-size:14px;line-height:1.55;color:oklch(0.88 0.045 206);white-space:pre-wrap;\">{{ sp.caption }}<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ sp.hasHashtags }}\">\n            <div>\n              <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:oklch(0.68 0.075 206);font-weight:600;\">Hashtags<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;\">\n                <sc-for list=\"{{ sp.hashtags }}\" as=\"tag\" hint-placeholder-count=\"4\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;padding:3px 9px;border-radius:6px;background:oklch(0.235 0.043 206);color:oklch(0.72 0.100 206);border:1px solid oklch(1 0 0 / 0.08);\">{{ tag }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"border-top:1px solid oklch(1 0 0 / 0.08);padding-top:18px;display:flex;flex-direction:column;gap:12px;\">\n            <div style=\"font-size:13px;font-weight:700;color:oklch(0.9 0.036 206);\">Comments <span style=\"color:oklch(0.68 0.075 206);font-weight:500;\">· {{ sp.commentCount }}<\u002Fspan><\u002Fdiv>\n\n            <sc-if value=\"{{ sp.hasComments }}\">\n              <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                <sc-for list=\"{{ sp.comments }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;gap:10px;padding:11px 13px;background:oklch(0.235 0.043 206);border:1px solid oklch(1 0 0 / 0.08);border-radius:11px;\">\n                    <div style=\"flex:none;padding-top:1px;\">{{ c.avatarEl }}<\u002Fdiv>\n                    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;\">\n                      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:baseline;\">\n                        <span style=\"font-weight:700;font-size:13px;color:oklch(0.9 0.036 206);\">{{ c.name }}<\u002Fspan>\n                        <div style=\"display:flex;align-items:center;gap:8px;flex:none;\">\n                          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(0.66 0.078 206);\">{{ c.timeLabel }}<\u002Fspan>\n                          <sc-if value=\"{{ c.canDelete }}\"><button onclick=\"{{ c.del }}\" title=\"Delete comment\" style=\"width:19px;height:19px;flex:none;border-radius:5px;border:none;background:oklch(0.3 0.049 206);color:oklch(0.66 0.13 25);cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;\">×<\u002Fbutton><\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:oklch(0.82 0.068 206);white-space:pre-wrap;\">{{ c.textEl }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sp.noComments }}\">\n              <div style=\"padding:14px;text-align:center;font-size:12.5px;color:oklch(0.66 0.078 206);border:1px dashed oklch(1 0 0 / 0.1);border-radius:10px;\">No comments yet — add the first review note.<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:2px;\">\n              <div style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:oklch(0.66 0.078 206);\">\n                {{ identityAvatarEl }}\n                Commenting as <span style=\"color:oklch(0.85 0.056 206);font-weight:700;\">{{ identityName }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative;\">\n                <textarea value=\"{{ draft }}\" onchange=\"{{ setDraft }}\" placeholder=\"Add a comment for the design team… (type @ to mention someone)\" style=\"width:100%;min-height:76px;padding:10px 12px;border-radius:9px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.16 0.033 206);color:oklch(0.9 0.036 206);font-size:13.5px;line-height:1.5;outline:none;resize:vertical;\"><\u002Ftextarea>\n                <sc-if value=\"{{ showMentionMenu }}\">\n                  <div style=\"position:absolute;bottom:calc(100% + 4px);left:0;right:0;z-index:12;max-height:200px;overflow:auto;background:oklch(0.235 0.043 206 / 0.98);backdrop-filter:blur(10px);border:1px solid oklch(1 0 0 / 0.14);border-radius:11px;padding:5px;box-shadow:0 14px 34px oklch(0.06 0 0 / 0.5);display:flex;flex-direction:column;gap:2px;\">\n                    <sc-for list=\"{{ mentionSuggestions }}\" as=\"ms\" hint-placeholder-count=\"0\">\n                      <button onclick=\"{{ ms.pick }}\" style=\"display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;text-align:left;background:transparent;\" style-hover=\"background:oklch(0.28 0.048 206)\">\n                        {{ ms.avatarEl }}\n                        <span style=\"font-size:13px;font-weight:600;color:oklch(0.88 0.045 206);\">{{ ms.name }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <button onclick=\"{{ addComment }}\" style=\"align-self:flex-end;background:{{ accent }};color:oklch(0.16 0 0);font-weight:700;font-size:13px;padding:9px 18px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;\">Post comment<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ canEdit }}\">\n            <div ref=\"{{ perfSectionRef }}\" style=\"border-top:1px solid oklch(1 0 0 / 0.08);padding-top:18px;display:flex;flex-direction:column;gap:12px;\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;\">\n                <span style=\"font-size:13px;font-weight:700;color:oklch(0.9 0.036 206);\">Performance <span style=\"color:oklch(0.68 0.075 206);font-weight:500;\">· admin only, per platform<\u002Fspan><\u002Fspan>\n                <sc-if value=\"{{ sp.metricsUpdatedLabel }}\"><span style=\"font-size:10.5px;color:oklch(0.66 0.078 206);font-family:'JetBrains Mono',monospace;\">updated {{ sp.metricsUpdatedLabel }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ needsPublishedLinks }}\">\n                <div style=\"padding:9px 12px;border-radius:9px;background:{{ accent }}22;border:1px solid {{ accent }}55;font-size:12px;color:oklch(0.92 0.028 206);\">📤 Marked as posted — paste the published link for each platform below so the team can find it fast.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ mfPlatformBlocks }}\" as=\"pb\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;flex-direction:column;gap:9px;padding:11px;border-radius:11px;background:oklch(0.16 0.033 206);border:1px solid oklch(1 0 0 / 0.08);\">\n                  <div style=\"display:flex;align-items:center;gap:8px;\">\n                    <span style=\"flex:none;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;{{ pb.badge }}\">{{ pb.label }}<\u002Fspan>\n                    <input value=\"{{ pb.linkValue }}\" onchange=\"{{ pb.linkOnChange }}\" placeholder=\"{{ pb.linkPlaceholder }}\" style=\"flex:1;padding:7px 10px;border-radius:8px;border:1px solid {{ pb.linkBorder }};background:oklch(0.2 0.038 206);color:oklch(0.9 0.036 206);font-size:11.5px;outline:none;font-family:'JetBrains Mono',monospace;\">\n                    <sc-if value=\"{{ pb.hasLink }}\">\n                      <button onclick=\"{{ pb.copyLink }}\" title=\"Copy link\" style=\"flex:none;width:28px;height:28px;border-radius:7px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.24 0.044 206);color:oklch(0.8 0.075 206);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;\">🔗<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:7px;\">\n                    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                      <span style=\"font-size:9.5px;color:oklch(0.68 0.075 206);font-weight:600;\">❤️ Likes<\u002Fspan>\n                      <input value=\"{{ pb.likesValue }}\" onchange=\"{{ pb.likesOnChange }}\" inputmode=\"numeric\" placeholder=\"0\" style=\"width:100%;padding:7px 8px;border-radius:7px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.2 0.038 206);color:oklch(0.9 0.036 206);font-size:12.5px;outline:none;\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                      <span style=\"display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:oklch(0.68 0.075 206);font-weight:600;\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><path d=\"M4 4h16v12H8l-4 4V4z\"><\u002Fpath><\u002Fsvg>Comm.<\u002Fspan>\n                      <input value=\"{{ pb.commentsValue }}\" onchange=\"{{ pb.commentsOnChange }}\" inputmode=\"numeric\" placeholder=\"0\" style=\"width:100%;padding:7px 8px;border-radius:7px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.2 0.038 206);color:oklch(0.9 0.036 206);font-size:12.5px;outline:none;\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                      <span style=\"font-size:9.5px;color:oklch(0.68 0.075 206);font-weight:600;\">🔁 Shares<\u002Fspan>\n                      <input value=\"{{ pb.sharesValue }}\" onchange=\"{{ pb.sharesOnChange }}\" inputmode=\"numeric\" placeholder=\"0\" style=\"width:100%;padding:7px 8px;border-radius:7px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.2 0.038 206);color:oklch(0.9 0.036 206);font-size:12.5px;outline:none;\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                      <span style=\"font-size:9.5px;color:oklch(0.68 0.075 206);font-weight:600;\">👁 Views<\u002Fspan>\n                      <input value=\"{{ pb.viewsValue }}\" onchange=\"{{ pb.viewsOnChange }}\" inputmode=\"numeric\" placeholder=\"0\" style=\"width:100%;padding:7px 8px;border-radius:7px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.2 0.038 206);color:oklch(0.9 0.036 206);font-size:12.5px;outline:none;\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                      <span style=\"font-size:9.5px;color:oklch(0.68 0.075 206);font-weight:600;\">🔖 Saves<\u002Fspan>\n                      <input value=\"{{ pb.savesValue }}\" onchange=\"{{ pb.savesOnChange }}\" inputmode=\"numeric\" placeholder=\"0\" style=\"width:100%;padding:7px 8px;border-radius:7px;border:1px solid oklch(1 0 0 / 0.1);background:oklch(0.2 0.038 206);color:oklch(0.9 0.036 206);font-size:12.5px;outline:none;\">\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button onclick=\"{{ saveMetrics }}\" style=\"align-self:flex-start;background:{{ accent }};color:oklch(0.16 0 0);font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;\">Save performance<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ historyOpen }}\">\n            <div style=\"border-top:1px solid oklch(1 0 0 / 0.08);padding-top:16px;display:flex;flex-direction:column;gap:8px;\">\n              <div style=\"font-size:13px;font-weight:700;color:oklch(0.9 0.036 206);\">History <span style=\"color:oklch(0.68 0.075 206);font-weight:500;\">· {{ sp.historyCount }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto;\">\n                <sc-for list=\"{{ sp.postHistory }}\" as=\"h\" hint-placeholder-count=\"2\">\n                  <div style=\"font-size:11.5px;color:oklch(0.68 0.075 206);line-height:1.5;\">\n                    <b style=\"color:oklch(0.82 0.068 206);font-weight:700;\">{{ h.actorName }}<\u002Fb> {{ h.verbLabel }} <span style=\"font-family:'JetBrains Mono',monospace;\">· {{ h.timeLabel }}<\u002Fspan>\n
